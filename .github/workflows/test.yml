name: test

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Cairo
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libpango-1.0-0
      - name: Install Python dependencies
        run: |
          python -m venv services/api/.venv
          services/api/.venv/bin/pip install -r services/api/requirements-dev.txt
      - name: Test the processing pipeline and API
        working-directory: services/api
        run: .venv/bin/pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install and build
        run: npm ci && npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://localhost:8000
