services:
  api:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    environment:
      STICKY_DATA_DIR: /data
      STICKY_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      STICKY_ENABLE_REMBG: "false"
      STICKY_SEGMENTATION_BACKEND: opencv
    volumes:
      - sticky-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - api

volumes:
  sticky-data:
